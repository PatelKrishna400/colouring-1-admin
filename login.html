<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ColourTap</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--light-blue);
    }
    .login-card {
      background: white;
      padding: 3rem;
      border-radius: 1rem;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-brand {
      color: var(--primary-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 2rem;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--gray-800);
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--gray-200);
    }
    .divider:not(:empty)::before { margin-right: .25em; }
    .divider:not(:empty)::after { margin-left: .25em; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
        ColourTap
      </div>
      
      <h2 style="margin-bottom: 1.5rem; font-size: 1.25rem;">Sign in to continue</h2>

      <button id="btn-google" class="btn btn-primary" style="width: 100%; justify-content: center; background-color: #4285F4;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="white" style="margin-right: 8px;"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/><path d="M1 1h22v22H1z" fill="none"/></svg>
        Sign in with Google
      </button>

      <div class="divider">OR</div>

      <div class="form-group" style="text-align: left;">
        <label class="form-label">Email Address</label>
        <input type="email" id="email-input" class="form-input" placeholder="Enter your email" required>
      </div>
      <div class="form-group" style="text-align: left;">
        <label class="form-label">Password</label>
        <input type="password" id="password-input" class="form-input" placeholder="Enter your password" required>
      </div>
      
      <div style="display: flex; gap: 1rem; margin-top: 1rem;">
        <button id="btn-login-email" class="btn btn-secondary" style="flex: 1; justify-content: center;">
          Login
        </button>
        <button id="btn-register" class="btn btn-primary" style="flex: 1; justify-content: center;">
          Register
        </button>
      </div>

      <div id="status-message" style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--primary-blue);"></div>
    </div>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
